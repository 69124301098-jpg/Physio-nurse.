<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Physio Nurse</title>
<style>
:root{--bg:#ffe4ef;--c:#fff;--p:#ff6fa5;--t:#5a2a41;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2b1420;--c:#3d1d2e;--t:#ffe4ef}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Sarabun",sans-serif;padding:14px;max-width:760px;margin:auto}
.card{background:var(--c);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 4px 14px #ff6fa533}
button{background:var(--p);color:#fff;border:0;border-radius:16px;padding:12px 18px;font-size:17px;margin:4px;font-family:inherit}
button.g{background:#fff;color:var(--p);border:2px solid var(--p)}h1,h2{color:var(--p);margin:6px 0}
.faces{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.f{text-align:center;border:3px solid transparent;border-radius:18px;padding:8px;background:var(--bg)}.f.s{border-color:var(--p)}
video{width:100%;border-radius:18px;background:#000;transform:scaleX(-1)}#tm{font-size:46px;text-align:center;color:var(--p)}
.hid{display:none}input[type=range]{width:100%}table{width:100%;font-size:14px}
</style></head><body>
<h1>🌸 Physio Nurse</h1><div id="app" class="card">กำลังโหลด…</div>
<script>
const LV=[
{n:"ระดับ 0 ไม่ปวด",c:"#fff",m:"smile2",ex:[["เอียงคอซ้าย-ขวาช้าๆ สลับกัน",30],["ก้มหน้าเก็บคางชิดอก ค้างไว้",30],["เงยหน้าขึ้นช้าๆ ค้างไว้",30]]},
{n:"ระดับ 1-3 ปวดเล็กน้อย",c:"#5cc96b",m:"smile",ex:[["เหยียดแขนไปฝั่งตรงข้าม ใช้มืออีกข้างดึงเข้าหาตัว ข้างละ 15 วิ (รวม 30)",30],["ยักไหล่ขึ้นสลับผ่อน",30],["เอียงคอซ้าย ใช้มือข้างเดียวกันช่วยดึงศีรษะ ข้างละ 15 วิ (รวม 30)",30]]},
{n:"ระดับ 4-6 ปวดปานกลาง",c:"#ffd23f",m:"flat",ex:[["ยกไหล่ขึ้นหมุนไปหลัง 10 ครั้ง แล้วหมุนไปหน้า 10 ครั้ง",40],["ประสานมือด้านหลัง ดึงแขนไปด้านหลัง ค้างไว้",30],["ประสานมือที่ท้ายทอย กางศอกเข้า-ออกสลับกัน",30]]},
{n:"ระดับ 7-9 ปวดมาก",c:"#ff9a3c",m:"frown",ex:[["ประสานมือยืดแขนเหนือศีรษะ เงยศีรษะขึ้น ค้างไว้",30],["ประสานมือด้านหลัง เอียงศีรษะซ้าย 15 วิ แล้วขวา 15 วิ",30],["ประสานมือเหยียดแขนเหนือศีรษะ เอียงตัวขวา 15 วิ ซ้าย 15 วิ",30]]},
{n:"ระดับ 10 ปวดรุนแรง",c:"#ff4d4d",m:"cry",ex:[["พนมมือไว้ด้านหลัง ค้างไว้",30],["ยกแขนขวาพับศอก ใช้มือซ้ายกดศอก 15 วิ แล้วสลับข้าง 15 วิ",30],["พับแขนสองข้าง ปลายนิ้วแตะหัวไหล่ ยกไหล่หมุนหน้า 15 ครั้ง หลัง 15 ครั้ง",40]]}];
const mouth={smile2:"M30 58Q50 80 70 58Z",smile:"M34 62Q50 72 66 62",flat:"M36 66H64",frown:"M34 70Q50 58 66 70",cry:"M34 72Q50 60 66 72"};
const face=l=>`<svg viewBox="0 0 100 100" width="80"><circle cx="50" cy="50" r="44" fill="${LV[l].c}" stroke="#444" stroke-width="3"/><circle cx="36" cy="42" r="4"/><circle cx="64" cy="42" r="4"/>${l==3?'<path d="M28 33L44 38M72 33L56 38" stroke="#444" stroke-width="3"/>':''}${l==4?'<path d="M30 52q-4 12 0 16M70 52q4 12 0 16" stroke="#2b8cff" stroke-width="4" fill="none"/>':''}<path d="${mouth[LV[l].m]}" stroke="#444" stroke-width="3" fill="${l==0?'#fff':'none'}"/></svg>`;
const $=s=>document.querySelector(s),app=$("#app");let db,user,assets,uid,lvl=null,st={},stream,rec,chunks=[],vids=[],admin=false,pre=0;
async function init(){try{user=await claude.use("user");db=await claude.use("db");assets=await claude.use("assets")}catch(e){}
if(!db||!user){app.innerHTML="<h2>เข้าสู่ระบบ</h2>กรุณาเปิดหน้านี้ผ่านบัญชี claude.ai ที่ได้รับเชิญ เพื่อลงชื่อเข้าใช้และบันทึกข้อมูล";return}
uid=await user.id();admin=user.isOwner();home()}
function inWin(){const h=new Date().getHours();return h==12||h==17}
async function mine(){try{const s=await db.collection("sessions").get();return s.docs.map(d=>d.data()).filter(d=>d.uid==uid)}catch(e){return[]}}
async function home(){const ms=await mine();const days=new Set(ms.map(m=>m.day)).size;
app.innerHTML=`<h2>สวัสดี 💗</h2><p>ทำแล้ว <b>${days}</b> วัน (เป้าหมาย 3-4 วันต่อเนื่อง) · รอบ 12:00-13:00 และ 17:00-18:00</p>
${inWin()?"":"<p>⏰ ตอนนี้ยังไม่ใช่เวลารอบกิจกรรม แต่ทดลองดูได้</p>"}
<div class="card"><b>ความรู้: อาการปวดคอ บ่า ไหล่</b><p>การก้มมองมือถือหรืออ่านหนังสือนานๆ ทำให้กล้ามเนื้อคอ บ่า ไหล่ตึงและล้า ควรพักและยืดเหยียดเป็นระยะ ถ้าปวดร้าวลงแขน ชา หรืออ่อนแรง ให้พบแพทย์<br><small>(ใส่ข้อมูลจาก รพ.สมิติเวช พร้อมลิงก์อ้างอิงที่นี่)</small></p></div>
<h2>วันนี้ปวดระดับไหน?</h2><div class="faces">${LV.map((l,i)=>`<div class="f" data-i="${i}" onclick="pick(${i})">${face(i)}<div><small>${l.n}</small></div></div>`).join("")}</div>
<button id="go" class="hid" onclick="start()">เริ่มกิจกรรม 🌷</button>${admin?'<button class="g" onclick="adm()">👩‍⚕️ Admin</button>':""}`}
function pick(i){lvl=i;document.querySelectorAll(".f").forEach(e=>e.classList.toggle("s",e.dataset.i==i));$("#go").classList.remove("hid")}
async function start(){st={i:0,t0:Date.now(),pre:lvl};vids=[];
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false})}catch(e){stream=null}
step()}
let timer;function step(){const e=LV[lvl].ex[st.i];let t=e[1];
app.innerHTML=`<h2>${LV[lvl].n} · ท่า ${st.i+1}/3</h2><p>${e[0]}</p>
${stream?`<video id="v" autoplay playsinline muted></video><label>ฟิลเตอร์ <select id="fl" onchange="flt()"><option value="">ปกติ</option><option value="brightness(1.1) saturate(1.3) contrast(.95) blur(.4px)">สวยใส</option><option value="sepia(.3) saturate(1.5) hue-rotate(-15deg) brightness(1.1)">ชมพูหวาน</option></select></label>`:"<p>⚠️ เปิดกล้องไม่ได้ (ตรวจสอบสิทธิ์กล้อง)</p>"}
<div id="tm">${t}</div><button id="b" onclick="run()">▶️ เริ่มทำท่า</button>`;
if(stream)$("#v").srcObject=stream;}
function flt(){$("#v").style.filter=$("#fl").value}
function run(){let t=LV[lvl].ex[st.i][1];$("#b").disabled=true;chunks=[];
if(stream&&window.MediaRecorder){rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.start()}
timer=setInterval(async()=>{t--;$("#tm").textContent=t;if(t<=0){clearInterval(timer);await stopRec();st.i++;st.i<3?step():post()}},1000)}
function stopRec(){return new Promise(r=>{if(!rec||rec.state=="inactive")return r();rec.onstop=async()=>{const b=new Blob(chunks,{type:rec.mimeType});try{if(assets){const a=await assets.upload(b);vids.push(a.id)}}catch(e){}r()};rec.stop()})}
function post(){if(stream)stream.getTracks().forEach(t=>t.stop());
app.innerHTML=`<h2>แบบประเมินหลังทำกิจกรรม</h2><p>ตอนนี้ปวดระดับเท่าไร (Pain score 0-10)</p><input type="range" min="0" max="10" value="0" id="ps" oninput="$('#pv').textContent=this.value"><h1 id="pv" style="text-align:center">0</h1><p style="display:flex;justify-content:space-between"><small>0 ไม่ปวด</small><small>10 ปวดมากที่สุด</small></p><button onclick="done()">บันทึก 💗</button>`}
async function done(){const now=new Date(),post=+$("#ps").value;
const rec={uid,name:(await user.me()).name||"",day:now.toLocaleDateString("sv"),time:now.toLocaleTimeString("th-TH"),ts:now.getTime(),level:lvl,pre:st.pre,post,vids,sec:Math.round((Date.now()-st.t0)/1000)};
try{await db.doc("sessions/"+uid+"_"+rec.ts).set(rec)}catch(e){}
app.innerHTML=`<h2>🎉 ทำกิจกรรมเสร็จสิ้น</h2><p>บันทึกเวลา: ${rec.day} ${rec.time}<br>ปวดก่อน/หลัง: ${rec.pre>=0?LV[rec.level].n:""} → ${post}/10</p><button onclick="home()">กลับหน้าแรก</button>`}
async function adm(){const s=await db.collection("sessions").get();const r=s.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts);
app.innerHTML=`<h2>Admin</h2><div style="overflow-x:auto"><table><tr><th>ผู้ใช้</th><th>วัน/เวลา</th><th>ระดับ</th><th>หลัง</th><th>วิดีโอ</th></tr>${r.map(x=>`<tr><td>${esc(x.name||x.uid.slice(0,6))}</td><td>${x.day} ${x.time}</td><td>${x.level}</td><td>${x.post}</td><td>${(x.vids||[]).map((v,i)=>`<a href="/_blob/${v}" target="_blank">ท่า${i+1}</a>`).join(" ")}</td></tr>`).join("")}</table></div><button onclick="home()">กลับ</button>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
init();
</script></body></html>
